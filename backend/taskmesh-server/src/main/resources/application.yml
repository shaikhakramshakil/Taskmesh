server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmesh}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: taskmesh

taskmesh:
  queue-threshold: ${TASKMESH_QUEUE_THRESHOLD:500}
  strategy: ${TASKMESH_STRATEGY:resource}
  dispatch-interval-ms: ${TASKMESH_DISPATCH_INTERVAL_MS:250}
  heartbeat:
    beat-seconds: 2
    suspect-missed: 3
    fail-missed: 5
    check-interval-ms: 2000
  kafka:
    enabled: true
  redis:
    enabled: true
  scheduling:
    enabled: true
