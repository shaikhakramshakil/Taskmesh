spring:
  datasource:
    url: jdbc:h2:mem:taskmesh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

taskmesh:
  queue-threshold: 3
  strategy: resource
  kafka:
    enabled: false
  redis:
    enabled: false
  scheduling:
    enabled: false
