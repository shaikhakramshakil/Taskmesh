global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskmesh-server
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["taskmesh-server:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
